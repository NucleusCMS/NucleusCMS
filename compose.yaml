services:
  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nucleus-root
      MYSQL_DATABASE: nucleus
      MYSQL_USER: nucleus
      MYSQL_PASSWORD: nucleus
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: >-
        CMD-SHELL
        if [ -n "$MYSQL_ROOT_PASSWORD" ]; then
          mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent;
        else
          mysqladmin ping -h 127.0.0.1 -uroot --silent;
        fi
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  db_data:
