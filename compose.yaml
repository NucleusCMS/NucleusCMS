services:
  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nucleus-root
      MYSQL_DATABASE: nucleus
      MYSQL_USER: nucleus
      MYSQL_PASSWORD: nucleus
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
