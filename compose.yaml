services:
  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nucleus-root
      MYSQL_DATABASE: nucleus
      MYSQL_USER: nucleus
      MYSQL_PASSWORD: nucleus
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=socket --socket=/run/mysqld/mysqld.sock --silent"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db_data:
